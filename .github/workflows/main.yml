name: Validations

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"

      - name: Install Ceedling
        run: gem install ceedling -v 0.31.1

      - name: Install GCov Reporter
        run: pip install gcovr

      # 🔹 Pre-commit no detiene el workflow si corrige archivos
      - name: Run Format Validations
        uses: pre-commit/action@v3.0.0
        continue-on-error: true

      # 🔹 Ejecuta los tests y genera cobertura, aunque haya fallos
      - name: Run Unit Tests
        run: ceedling clobber gcov:all #utils:gcov || true

      # 🔹 Reporte de resultados de tests en formato XML
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Ceedling Unit Tests
          path: build/artifacts/test/report.xml   # ✅ XML generado por junit_tests_report
          reporter: jest-junit

      # 🔹 Reporte de cobertura en Markdown y badge
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: build/artifacts/gcov/GcovCoverageCobertura.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: "60 80"

      # 🔹 Muestra el resumen de cobertura en la vista del job
      - name: Output to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      # 🔹 Comenta automáticamente el PR con el resumen de cobertura
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
